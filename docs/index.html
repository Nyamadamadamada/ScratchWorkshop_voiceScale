<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声から音階を作ろう</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <!-- 画面1　ろくおん -->
      <section class="screen" id="screen-record" data-active>
        <h1>声から音階を作ろう！</h1>

        <button class="mic" id="mic-button" type="button" aria-label="録音する">
          <svg class="mic-icon" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="mic-ring" cx="50" cy="50" r="30" />
            <rect x="38" y="14" width="24" height="44" rx="12" />
            <path class="mic-arc" d="M26 46a24 24 0 0 0 48 0" />
            <line x1="50" y1="70" x2="50" y2="84" />
            <line x1="36" y1="84" x2="64" y2="84" />
          </svg>
          <span class="count" id="count"></span>
        </button>

        <p class="hint" id="record-hint">マイクを押してね</p>
        <p class="error" id="record-error"></p>
      </section>

      <!-- 画面2　聞いて、保存する -->
      <section class="screen" id="screen-result">
        <h1>君だけのドレミファソラシド</h1>

        <p class="aside">
          <button class="mini" type="button" id="play-original">元の声を聞く</button>
        </p>

        <div class="keys" id="result-keys"></div>
        <p class="near" id="near-note"></p>
        <div class="actions">
          <button class="solid big" type="button" id="download-all">8つ まとめてダウンロード</button>
          <p class="hint" id="download-hint">
            「まとめてダウンロードしますか？」と出たら「許可」を押してね
          </p>
          <button class="ghost" type="button" data-goto="record">もう一度 録音する</button>
        </div>
      </section>

      <p class="note">
        録音した声はサーバーに送信されません。<br />音声を変換後、ダウンロードしない限りどこにも保存されません。
      </p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
