[project]
name = "voice-scale"
version = "0.1.0"
description = "声を録音してドレミファソラシドの8音をつくる"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.scripts]
voice-scale = "voice_scale.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "librosa>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_scale"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# コメントも文言も日本語で書くため、全角記号の警告は切る
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
